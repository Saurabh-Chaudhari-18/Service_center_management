# Service Center Management - Nginx config
# Place in /etc/nginx/sites-available/scm and symlink to sites-enabled.
# Replace YOUR_DOMAIN_OR_IP and SSL paths as needed.

upstream backend {
    server 127.0.0.1:8001;
}

upstream frontend {
    server 127.0.0.1:3000;
}

# Redirect HTTP -> HTTPS (uncomment after enabling SSL)
# server {
#     listen 80;
#     server_name YOUR_DOMAIN_OR_IP;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;   # Uncomment for HTTPS
    server_name _;  # Replace with YOUR_DOMAIN_OR_IP or EC2 public IP

    # SSL (uncomment and set paths after running certbot)
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Django static & media (adjust paths to your deploy directory)
    set $app_root /home/ubuntu/Service_center_management;
    set $backend_root $app_root/Backend;
    set $frontend_root $app_root/frontend;

    # API and Django admin -> Gunicorn
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (collectstatic output)
    location /static/ {
        alias $backend_root/staticfiles/;
    }

    # Django media files (uploads)
    location /media/ {
        alias $backend_root/media/;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Health check (optional)
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
