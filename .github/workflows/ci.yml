name: CI

on:
  push:
    branches: [main, DEV, Production]
  pull_request:
    branches: [main, Production]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: Backend

    env:
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-characters-123456789
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS1ub3QtZm9yLXByb2Q=' }}
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --deploy

      - name: Run migrations (verify they apply cleanly)
        run: python manage.py migrate --no-input

      - name: Run tests
        run: pytest -n auto --dist loadscope --tb=short -q

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api

  # ─── Full Docker Compose deployment smoke test ───────────────────────────────
  docker:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create non-secret CI environment
        run: |
          cp Backend/.env.example Backend/.env
          echo 'SECRET_KEY=ci-only-secret-key-with-more-than-fifty-random-characters-123456789' >> Backend/.env
          echo 'ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS1ub3QtZm9yLXByb2Q=' >> Backend/.env
          echo 'EMAIL_HOST_USER=ci@example.com' >> Backend/.env
          echo 'EMAIL_HOST_PASSWORD=ci-placeholder' >> Backend/.env
          echo 'BACKUP_VERIFICATION_TOKEN=ci-restore-drill' >> Backend/.env
          echo 'ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx' >> Backend/.env

      - name: Start complete stack
        run: docker compose up -d --build

      - name: Wait for stack readiness
        run: |
          for attempt in $(seq 1 48); do
            if curl --fail --silent http://localhost/api/readyz/ > readiness.json; then
              cat readiness.json
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color backend celery-worker celery-beat nginx
          exit 1

      - name: Verify API, frontend, worker, scheduler, and shared media
        run: |
          curl --fail --silent http://localhost/api/healthz/
          curl --fail --silent http://localhost/ > /dev/null
          docker compose exec -T backend sh -c 'printf media-smoke > /app/media/ci-smoke.txt'
          test "$(curl --fail --silent http://localhost/media/ci-smoke.txt)" = 'media-smoke'
          docker compose exec -T celery-worker celery -A config inspect ping --timeout 5

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
