name: CI

on:
  push:
    branches: [main, DEV, Production]
  pull_request:
    branches: [main, Production]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: Backend

    env:
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-characters-123456789
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS1ub3QtZm9yLXByb2Q=' }}
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check --deploy

      - name: Run migrations (verify they apply cleanly)
        run: python manage.py migrate --no-input

      - name: Run tests
        run: pytest --tb=short -q

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api

  # ─── Docker build smoke test ─────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Production'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t scm-backend:ci ./Backend

      - name: Docker backend smoke test
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:///app_data.db \
            -e SECRET_KEY=ci-only-secret-key-with-more-than-fifty-random-characters-123456789 \
            -e DEBUG=False \
            --entrypoint="" \
            scm-backend:ci python manage.py migrate --noinput

      - name: Build frontend image
        run: docker build -t scm-frontend:ci ./frontend
