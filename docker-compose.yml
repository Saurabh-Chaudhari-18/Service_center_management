services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: scm
      POSTGRES_DB: scm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://scm:scm@postgres:5432/scm
      GUNICORN_BIND: "0.0.0.0:8001"
    volumes:
      - scm_static:/app/staticfiles
      - scm_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/scm-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - scm_static:/var/www/static:ro
      - scm_media:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  scm_static:
  scm_media:
